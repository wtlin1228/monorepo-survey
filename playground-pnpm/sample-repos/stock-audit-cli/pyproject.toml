[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-stock-audit"
version = "0.3.1"
description = "Audit warehouse stock CSV exports for anomalies"
requires-python = ">=3.10"

[project.scripts]
acme-stock-audit = "stock_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
